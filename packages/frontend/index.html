<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="FolioBuddy" />
    <meta name="apple-mobile-web-app-title" content="FolioBuddy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11121d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>FolioBuddy</title>
    <meta
      name="description"
      content="FolioBuddy is a private portfolio dashboard that tracks crypto, equities, funds and cash side by side — live prices, daily snapshots, honest benchmarks."
    />
    <meta property="og:title" content="FolioBuddy — every asset, one quiet dashboard" />
    <meta
      property="og:description"
      content="One calm ledger for coins, stocks, funds and cash. Live prices, daily snapshots, benchmarks that tell the truth."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foliobuddy.xyz/" />
    <style>
      .app-startup {
        display: grid;
        min-height: 100vh;
        place-content: center;
        justify-items: center;
        gap: 0.75rem;
        font:
          500 0.875rem system-ui,
          sans-serif;
        color: #4d5166;
        background: #fcfcfd;
      }
      .dark .app-startup {
        color: #b9bbcd;
        background: #11121d;
      }
    </style>
    <script>
      // Prevent flash of wrong theme on initial load
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var theme = stored ? JSON.parse(stored).state.theme : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-startup" role="status">
        <img src="/logo.svg" width="40" height="40" alt="" />
        <span>Loading FolioBuddy…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
