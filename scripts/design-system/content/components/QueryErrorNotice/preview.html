<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QueryErrorNotice — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      function Demo() {
        var s = React.useState(false);
        function retry() {
          s[1](true);
          setTimeout(function () {
            s[1](false);
          }, 1200);
        }
        return h(
          'div',
          { className: 'max-w-xl space-y-3' },
          h(FB.QueryErrorNotice, { subject: 'positions', onRetry: retry, retrying: s[0] }),
          h(FB.QueryErrorNotice, {
            subject: 'prices',
            hasData: true,
            onRetry: retry,
            retrying: s[0],
          })
        );
      }
      mount(h(Demo));
    </script>
  </body>
</html>
