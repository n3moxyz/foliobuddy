<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Textarea — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      mount(
        h(
          'div',
          { className: 'grid max-w-lg gap-4' },
          h(
            'div',
            { className: 'grid gap-2' },
            h(FB.Label, { htmlFor: 'notes' }, 'Notes'),
            h(FB.Textarea, { id: 'notes', placeholder: 'Why this snapshot matters…' })
          ),
          h(FB.Textarea, {
            'aria-label': 'Trade JSON to import',
            rows: 4,
            className: 'font-mono text-base sm:text-xs',
            placeholder:
              '[{"asset": {"symbol": "BTC", "name": "Bitcoin", "category": "LIQUID_CRYPTO"}, "direction": "LONG", "entryPrice": 50000, "quantity": 0.5, "entryDate": "2026-01-15"}, ...]',
          })
        )
      );
    </script>
  </body>
</html>
