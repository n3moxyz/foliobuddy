<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Button — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      function icon(C, cls) {
        return h(C, { className: cls || 'mr-2 h-4 w-4', 'aria-hidden': true });
      }
      mount(
        h(
          'div',
          { className: 'space-y-3' },
          h(
            'div',
            { className: 'flex flex-wrap items-center gap-2' },
            h(FB.Button, null, icon(I.Plus), 'Add Position'),
            h(FB.Button, { variant: 'outline' }, icon(I.RefreshCw), 'Refresh Prices'),
            h(FB.Button, { variant: 'secondary' }, 'Copy All'),
            h(FB.Button, { variant: 'ghost' }, 'Cancel'),
            h(FB.Button, { variant: 'destructive' }, 'Delete'),
            h(FB.Button, { variant: 'link' }, 'View trade journal')
          ),
          h(
            'div',
            { className: 'flex flex-wrap items-center gap-2' },
            h(
              FB.Button,
              { size: 'sm', variant: 'outline' },
              icon(I.Copy, 'mr-1 h-4 w-4'),
              'Copy All'
            ),
            h(FB.Button, { size: 'sm' }, icon(I.Plus, 'mr-1 h-4 w-4'), 'Add'),
            h(FB.Button, { size: 'lg' }, 'Sign in'),
            h(
              FB.Button,
              { size: 'icon', variant: 'ghost', 'aria-label': 'More actions' },
              icon(I.MoreVertical, 'h-4 w-4')
            ),
            h(FB.Button, { disabled: true }, 'Retrying…')
          )
        )
      );
    </script>
  </body>
</html>
