<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AppToaster — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      // Keep the toaster's theme in step with the frame's theme (the app drives this from its theme store).
      var docEl = document.documentElement;
      function syncTheme() {
        FB.useThemeStore
          .getState()
          .setTheme(docEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
      }
      syncTheme();
      new MutationObserver(syncTheme).observe(docEl, {
        attributes: true,
        attributeFilter: ['data-theme'],
      });
      mount(
        h(
          'div',
          null,
          h(FB.AppToaster, null),
          h(
            'div',
            { className: 'flex flex-wrap gap-2' },
            h(
              FB.Button,
              {
                variant: 'outline',
                size: 'sm',
                onClick: function () {
                  FB.toast.success('Prices refreshed');
                },
              },
              'Success Toast'
            ),
            h(
              FB.Button,
              {
                variant: 'outline',
                size: 'sm',
                onClick: function () {
                  FB.toast.error('Price refresh failed');
                },
              },
              'Failure Toast'
            )
          )
        )
      );
      setTimeout(function () {
        FB.toast.success('Snapshot created');
      }, 300);
    </script>
  </body>
</html>
