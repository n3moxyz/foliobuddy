<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dialog — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      mount(
        h(
          FB.Dialog,
          { defaultOpen: true },
          h(
            FB.DialogTrigger,
            { asChild: true },
            h(FB.Button, { variant: 'destructive' }, 'Delete')
          ),
          h(
            FB.DialogContent,
            {
              onOpenAutoFocus: function (e) {
                e.preventDefault();
              },
            },
            h(
              FB.DialogHeader,
              null,
              h(FB.DialogTitle, null, 'Delete Position'),
              h(
                FB.DialogDescription,
                null,
                'Are you sure you want to delete your BTC position? This action cannot be undone.'
              )
            ),
            h(
              'div',
              { className: 'flex items-center space-x-2 py-2' },
              h(FB.Checkbox, { id: 'dont-ask' }),
              h(
                'label',
                { htmlFor: 'dont-ask', className: 'cursor-pointer text-sm text-muted-foreground' },
                "Don't ask me again"
              )
            ),
            h(
              FB.DialogFooter,
              null,
              h(FB.DialogClose, { asChild: true }, h(FB.Button, { variant: 'outline' }, 'Cancel')),
              h(FB.Button, { variant: 'destructive' }, 'Delete')
            )
          )
        )
      );
    </script>
  </body>
</html>
