<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Collapsible — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      function Demo() {
        var s = React.useState(true);
        return h(
          FB.Collapsible,
          { open: s[0], onOpenChange: s[1], className: 'max-w-sm space-y-2' },
          h(
            'div',
            { className: 'flex items-center justify-between' },
            h('p', { className: 'text-sm font-medium' }, 'Closed Positions'),
            h(
              FB.CollapsibleTrigger,
              { asChild: true },
              h(
                FB.Button,
                { variant: 'ghost', size: 'sm' },
                s[0] ? 'Hide' : 'Show 2 more',
                h(I.ChevronDown, {
                  className:
                    'ml-1 h-4 w-4 transition-transform duration-200 ' + (s[0] ? 'rotate-180' : ''),
                  'aria-hidden': true,
                })
              )
            )
          ),
          h(
            FB.CollapsibleContent,
            {
              className:
                'overflow-hidden data-[state=open]:animate-collapsible-down data-[state=closed]:animate-collapsible-up',
            },
            h(
              'div',
              { className: 'space-y-1 text-sm text-muted-foreground' },
              h('p', null, 'AVAX — closed 3 Mar'),
              h('p', null, 'ARB — closed 18 Feb')
            )
          )
        );
      }
      mount(h(Demo));
    </script>
  </body>
</html>
