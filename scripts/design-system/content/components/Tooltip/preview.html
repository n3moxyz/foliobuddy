<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tooltip — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      mount(
        h(
          FB.TooltipProvider,
          { delayDuration: 150 },
          h(
            'div',
            { className: 'flex items-center gap-2' },
            h(
              FB.Tooltip,
              { defaultOpen: true },
              h(
                FB.TooltipTrigger,
                { asChild: true },
                h(
                  FB.Button,
                  { variant: 'ghost', size: 'icon', 'aria-label': 'Refresh prices' },
                  h(I.RefreshCw, { className: 'h-4 w-4' })
                )
              ),
              h(FB.TooltipContent, { side: 'right' }, 'Refresh prices')
            )
          )
        )
      );
    </script>
  </body>
</html>
