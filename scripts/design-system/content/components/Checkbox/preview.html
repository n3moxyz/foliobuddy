<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkbox — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      function row(id, text, props) {
        return h(
          'div',
          { className: 'flex items-center space-x-2' },
          h(FB.Checkbox, Object.assign({ id: id }, props)),
          h(
            'label',
            { htmlFor: id, className: 'cursor-pointer text-sm text-muted-foreground' },
            text
          )
        );
      }
      mount(
        h(
          'div',
          { className: 'space-y-4' },
          row('ask', "Don't ask me again", {}),
          row('custody', 'Held for someone else', { defaultChecked: true }),
          row('locked', 'Linked IBKR holding', { defaultChecked: true, disabled: true })
        )
      );
    </script>
  </body>
</html>
