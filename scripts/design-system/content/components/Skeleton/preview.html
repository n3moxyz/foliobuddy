<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skeleton — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      mount(
        h(
          'div',
          { role: 'status', className: 'max-w-md space-y-3' },
          h('span', { className: 'sr-only' }, 'Loading positions…'),
          h(FB.Skeleton, { className: 'h-9 w-48' }),
          h(
            'div',
            { className: 'flex gap-3' },
            h(FB.Skeleton, { className: 'h-4 w-24' }),
            h(FB.Skeleton, { className: 'h-4 w-16' }),
            h(FB.Skeleton, { className: 'h-4 w-20' })
          ),
          h(FB.Skeleton, { className: 'h-12 w-full' }),
          h(FB.Skeleton, { className: 'h-12 w-full' })
        )
      );
    </script>
  </body>
</html>
