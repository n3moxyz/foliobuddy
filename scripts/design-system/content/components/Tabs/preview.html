<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabs — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      mount(
        h(
          FB.Tabs,
          { defaultValue: 'review' },
          h(
            FB.TabsList,
            null,
            h(FB.TabsTrigger, { value: 'review' }, 'Review'),
            h(FB.TabsTrigger, { value: 'ticker' }, 'Ticker Dossier'),
            h(FB.TabsTrigger, { value: 'monthly' }, 'Monthly Postmortem')
          ),
          h(
            FB.TabsContent,
            { value: 'review', className: 'text-sm text-muted-foreground' },
            'All, open and closed trades above the shared trade tape.'
          ),
          h(
            FB.TabsContent,
            { value: 'ticker', className: 'text-sm text-muted-foreground' },
            "One ticker's full history, P&L and open exposure."
          ),
          h(
            FB.TabsContent,
            { value: 'monthly', className: 'text-sm text-muted-foreground' },
            'Month summaries, edge tags and a loss review.'
          )
        )
      );
    </script>
  </body>
</html>
