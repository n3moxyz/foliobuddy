<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Label — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      mount(
        h(
          'div',
          { className: 'grid max-w-sm gap-4' },
          h(
            'div',
            { className: 'grid gap-2' },
            h(FB.Label, { htmlFor: 'investor' }, 'Investor Name'),
            h(FB.Input, { id: 'investor', placeholder: 'e.g. Alex' })
          ),
          h(
            'div',
            { className: 'flex items-center gap-2' },
            h(FB.Checkbox, { id: 'owner', disabled: true, defaultChecked: true }),
            h(FB.Label, { htmlFor: 'owner' }, 'Primary owner')
          )
        )
      );
    </script>
  </body>
</html>
