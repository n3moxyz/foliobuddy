<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FormattedNumberInput — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      function Demo() {
        var s = React.useState('12500.5');
        return h(
          'div',
          { className: 'grid max-w-xs gap-2' },
          h(FB.Label, { htmlFor: 'cost' }, 'Total Cost (USD)'),
          h(FB.FormattedNumberInput, { id: 'cost', value: s[0], onValueChange: s[1] }),
          h(
            'p',
            { className: 'font-mono text-xs text-muted-foreground' },
            'Saved as "' + s[0] + '"'
          )
        );
      }
      mount(h(Demo));
    </script>
  </body>
</html>
