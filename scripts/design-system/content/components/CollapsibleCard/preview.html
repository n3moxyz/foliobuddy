<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CollapsibleCard — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var FB = window.FolioBuddy,
        I = FB.Icons,
        h = React.createElement;
      function mount(el) {
        ReactDOM.createRoot(document.getElementById('root')).render(el);
      }
      var rows = [
        ['BTC', '$28,895'],
        ['ETH', '$19,718'],
        ['SOL', '$20,475'],
      ];
      function Demo() {
        var s = React.useState(true);
        return h(
          FB.CollapsibleCard,
          {
            title: 'Crypto (3)',
            isExpanded: s[0],
            onToggle: function () {
              s[1](!s[0]);
            },
            icon: h(I.Coins, { className: 'h-4 w-4 text-crypto', 'aria-hidden': true }),
            accentColor: 'border-crypto/40 bg-crypto/5',
            headerRight: h(
              'span',
              { className: 'font-mono text-sm font-medium tabular-nums' },
              '$69,088'
            ),
          },
          h(
            'div',
            { className: 'divide-y' },
            rows.map(function (r) {
              return h(
                'div',
                { key: r[0], className: 'flex justify-between py-2 text-sm' },
                h('span', { className: 'font-medium' }, r[0]),
                h('span', { className: 'font-mono' }, r[1])
              );
            })
          )
        );
      }
      mount(h(Demo));
    </script>
  </body>
</html>
