name: Sync Backend Env to Coolify

# Pushes the current owner Clerk user ID into both admin and agent mappings in
# Coolify, then redeploys. This repository currently supports one owner ID in
# this workflow because AGENT_USER_ID must be exactly one Clerk user ID.
# Re-run after rotating Clerk or the owner ID:
#   gh secret set ADMIN_USER_IDS --body "user_xxx"
#   gh workflow run sync-backend-env.yml
on:
  workflow_dispatch:

jobs:
  sync-env:
    name: Upsert env + redeploy
    runs-on: ubuntu-latest

    steps:
      - name: Validate owner user ID
        timeout-minutes: 1
        run: |
          owner_user_id='${{ secrets.ADMIN_USER_IDS }}'
          if [ -z "$owner_user_id" ]; then
            echo "ADMIN_USER_IDS secret is empty"
            exit 1
          fi
          case "$owner_user_id" in
            *,*)
              echo "ADMIN_USER_IDS contains multiple IDs; AGENT_USER_ID requires exactly one"
              exit 1
              ;;
          esac

      - name: Upsert owner mappings in Coolify
        timeout-minutes: 2
        run: |
          base="${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/envs"
          auth="Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
          owner_user_id='${{ secrets.ADMIN_USER_IDS }}'

          for key in ADMIN_USER_IDS AGENT_USER_ID; do
            payload=$(jq -nc --arg key "$key" --arg value "$owner_user_id" \
              '{key:$key,value:$value,is_preview:false}')

            # Create first; fall back to update if the key already exists.
            # Do not print response bodies: Coolify may return secret values.
            http_code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$base" \
              -H "$auth" -H "Content-Type: application/json" -d "$payload")
            echo "$key POST status: $http_code"
            if [ "$http_code" -ge 400 ]; then
              http_code=$(curl -s -o /tmp/resp -w "%{http_code}" -X PATCH "$base" \
                -H "$auth" -H "Content-Type: application/json" -d "$payload")
              echo "$key PATCH status: $http_code"
            fi
            if [ "$http_code" -ge 400 ]; then
              echo "Failed to upsert $key"
              exit 1
            fi
          done

      - name: Trigger Coolify Deploy
        timeout-minutes: 2
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"${{ secrets.COOLIFY_APP_UUID }}","force":true}')
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Deploy failed with status $http_code"
            exit 1
          fi

      - name: Wait for Coolify rebuild
        run: sleep 120

      - name: Health check
        run: |
          BACKEND_URL="https://api.foliobuddy.xyz"
          for i in 1 2 3 4 5; do
            response=$(curl -s -w "\n%{http_code}" "${BACKEND_URL}/health")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $i: HTTP $http_code - $body"
            if [ "$http_code" -eq 200 ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed after 5 attempts"
          exit 1
