name: Sync Backend Env to Coolify

# Pushes the ADMIN_USER_IDS, CLERK_SECRET_KEY and CLERK_PUBLISHABLE_KEY GitHub
# secrets into the Coolify app's environment and redeploys so the container
# picks them up. Empty/unset secrets are skipped, so you can rotate one at a time:
#   gh secret set ADMIN_USER_IDS --body "user_xxx,user_yyy"
#   gh secret set CLERK_SECRET_KEY            # interactive paste, never in shell history
#   gh secret set CLERK_PUBLISHABLE_KEY --body "pk_live_..."
#   gh workflow run sync-backend-env.yml
on:
  workflow_dispatch:

jobs:
  sync-env:
    name: Upsert env + redeploy
    runs-on: ubuntu-latest

    steps:
      - name: Upsert env vars in Coolify
        timeout-minutes: 3
        env:
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          base="${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/envs"
          auth="Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

          upsert() {
            key="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "$key: secret not set, skipping"
              return 0
            fi
            payload=$(printf '{"key":"%s","value":"%s","is_preview":false}' "$key" "$value")
            # Create first; fall back to update if the key already exists
            http_code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST "$base" \
              -H "$auth" -H "Content-Type: application/json" -d "$payload")
            echo "$key POST status: $http_code -> $(cat /tmp/resp)"
            if [ "$http_code" -ge 400 ]; then
              http_code=$(curl -s -o /tmp/resp -w "%{http_code}" -X PATCH "$base" \
                -H "$auth" -H "Content-Type: application/json" -d "$payload")
              echo "$key PATCH status: $http_code -> $(cat /tmp/resp)"
            fi
            if [ "$http_code" -ge 400 ]; then
              echo "Failed to upsert $key"
              exit 1
            fi
          }

          upsert ADMIN_USER_IDS "$ADMIN_USER_IDS"
          upsert CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          upsert CLERK_PUBLISHABLE_KEY "$CLERK_PUBLISHABLE_KEY"

      - name: Trigger Coolify Deploy
        timeout-minutes: 2
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"${{ secrets.COOLIFY_APP_UUID }}","force":true}')
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Deploy failed with status $http_code"
            exit 1
          fi

      - name: Wait for Coolify rebuild
        run: sleep 120

      - name: Health check
        run: |
          BACKEND_URL="https://api.foliobuddy.xyz"
          for i in 1 2 3 4 5; do
            response=$(curl -s -w "\n%{http_code}" "${BACKEND_URL}/health")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $i: HTTP $http_code - $body"
            if [ "$http_code" -eq 200 ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed after 5 attempts"
          exit 1
