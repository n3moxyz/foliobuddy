name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foliobuddy_nav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright toolchain
        run: npx playwright --version

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/backend

      - name: Type check backend
        run: npx tsc --noEmit
        working-directory: packages/backend

      - name: Type check frontend
        run: npx tsc --noEmit
        working-directory: packages/frontend

      - name: Run tests
        run: npm test

      - name: Verify NAV migration and transactional valuations
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foliobuddy_nav_test
        run: |
          npx prisma migrate deploy
          npx tsx scripts/verify-unit-trust-nav.ts

      - name: Build frontend
        run: npm run build
        working-directory: packages/frontend

      - name: Check formatting
        run: npm run format:check

      - name: Verify workspace deps are declared
        # Catches missing workspace dependencies that local npm install would
        # silently resolve via root hoisting but Vercel's build rejects.
        run: npm ls --workspaces --depth=0
