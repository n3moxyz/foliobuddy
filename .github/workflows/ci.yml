name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright toolchain
        run: npx playwright --version

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/backend

      - name: Type check backend
        run: npx tsc --noEmit
        working-directory: packages/backend

      - name: Type check frontend
        run: npx tsc --noEmit
        working-directory: packages/frontend

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
        working-directory: packages/frontend

      - name: Check formatting
        run: npm run format:check

      - name: Verify workspace deps are declared
        # Catches missing workspace dependencies that local npm install would
        # silently resolve via root hoisting but Vercel's build rejects.
        run: npm ls --workspaces --depth=0
