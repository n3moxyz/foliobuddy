name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deploy
        timeout-minutes: 2
        run: |
          # Requires COOLIFY_API_TOKEN secret to be configured in GitHub Actions
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"${{ secrets.COOLIFY_APP_UUID }}","force":true}')
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Deploy failed with status $http_code"
            exit 1
          fi

      - name: Wait for Coolify rebuild
        run: sleep 120

      - name: Health check
        run: |
          BACKEND_URL="https://api.foliobuddy.xyz"
          for i in 1 2 3 4 5; do
            response=$(curl -s -w "\n%{http_code}" "${BACKEND_URL}/health")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $i: HTTP $http_code - $body"
            if [ "$http_code" -eq 200 ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed after 5 attempts"
          exit 1
